# ═══════════════════════════════════════════════════════════════════════
#  Producción en este servidor, detrás del túnel de Cloudflare.
#
#  Se usa junto al compose base y SIN el override de desarrollo:
#
#      docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#  (el `make deploy` lo hace por ti)
#
#  Qué cambia respecto a desarrollo:
#
#  · Nada se publica a internet salvo el contenedor web, y solo a través
#    del túnel. La base, Redis y la API dejan de tener puerto en el host:
#    el navegador nunca los llama —todo pasa por el BFF de Astro— así que
#    exponerlos solo abriría superficie sin dar nada a cambio.
#  · El web sí se ata a 127.0.0.1 para poder comprobarlo desde el propio
#    servidor sin que quede accesible desde fuera.
#  · Las migraciones corren como un paso aparte que tiene que terminar
#    bien antes de que arranque la API. Si fallan, la versión vieja sigue
#    en pie en vez de quedar a medias.
# ═══════════════════════════════════════════════════════════════════════

services:
  db:
    # Sin puerto en el host: solo la alcanza la red interna de docker.
    ports: !reset []

  redis:
    ports: !reset []

  migraciones:
    image: zonepark-api:prod
    build:
      context: ./backend
      target: prod
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    ports: !reset []
    environment:
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully

  web:
    # APP_ENV le falta al compose base, y de él depende que la cookie de
    # sesión se marque `secure`. Sin esto viajaría sin marcar incluso
    # detrás de HTTPS.
    environment:
      APP_ENV: production
    ports: !override
      - "127.0.0.1:${WEB_PORT}:${WEB_PORT}"
    networks:
      - default
      - publica

networks:
  publica:
    # Red compartida con cloudflared. Se crea aparte, con `make red`, para
    # que no dependa del ciclo de vida de ninguno de los dos proyectos:
    # bajar el túnel no debe tumbar el parqueadero ni al revés.
    external: true
    name: zonepark-publica
